services:
  # 1. MinIO (File Storage)
  minio:
    image: minio/minio:latest
    container_name: webbriks_minio
    restart: always
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # 2. NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webbriks_backend
    restart: always
    ports:
      - "${PORT:-6001}:6001"
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=minio
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    depends_on:
      - minio

  # 3. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webbriks_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      # Internal URL for Server Components to reach the backend inside Docker network
      - INTERNAL_API_URL=http://backend:6001/api/v1
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    command: npm run dev
    depends_on:
      - backend

volumes:
  minio_data:
