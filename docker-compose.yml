
services:
  # 1. MinIO (File Storage)
  minio:
    image: minio/minio:latest
    container_name: webbriks_minio
    restart: always
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # 2. NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webbriks_backend
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      # These override the .env file for the docker container to use internal networking
      - MINIO_ENDPOINT=minio
    volumes:
      # Mount your local code into the container for instant hot-reloading
      - ./backend:/usr/src/app
      # Prevent your Mac's node_modules from overwriting the Linux container's node_modules
      - /usr/src/app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"
    depends_on:
      - minio

  # 3. Next.js Frontend (Commented out until you build it)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: webbriks_frontend
  #   ports:
  #     - "3001:3000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - backend

volumes:
  minio_data:
